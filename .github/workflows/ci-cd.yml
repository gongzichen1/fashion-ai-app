name: Verify and deploy

on:
  push:
    branches: [main, develop, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified commit to CloudBase production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r src/backend/requirements.txt -r requirements-dev.txt

      - name: Verify backend
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q
          python -m black --check src/backend tests scripts/verify_deployment.py scripts/verify_two_account_isolation.py
          python -m isort --check-only src/backend tests scripts/verify_deployment.py scripts/verify_two_account_isolation.py
          python -m flake8 src/backend tests scripts/verify_deployment.py scripts/verify_two_account_isolation.py --exclude=src/backend/venv --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m compileall -q src/backend tests scripts/verify_deployment.py scripts/verify_two_account_isolation.py
          python -m pip_audit -r src/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/feishu-web/package-lock.json

      - name: Verify Feishu H5
        working-directory: src/feishu-web
        run: |
          npm ci
          npm test
          npm audit --audit-level=high
          npm run build

      - name: Verify WeChat JavaScript syntax
        run: find src/frontend -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

  container:
    runs-on: ubuntu-latest
    needs: [verify, managed-databases]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: zhida-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  managed-databases:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fashion
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: fashion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fashion -d fashion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: fashion
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ptest-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - run: python -m pip install -r src/backend/requirements.txt pytest
      - name: Verify MySQL and PostgreSQL adapters
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://fashion:test-password@127.0.0.1:5432/fashion
          TEST_MYSQL_URL: mysql+pymysql://root:test-password@127.0.0.1:3306/fashion?charset=utf8mb4
        run: python -m pytest -q tests/test_managed_database.py

  deploy:
    runs-on: ubuntu-latest
    needs: [verify, container]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    environment: production
    concurrency:
      group: zhida-cloudbase-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate deployment secrets
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SERVICE_NAME: ${{ secrets.TCB_SERVICE_NAME }}
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
        run: |
          test -n "$TCB_SECRET_ID"
          test -n "$TCB_SECRET_KEY"
          test -n "$TCB_ENV_ID"
          test -n "$TCB_SERVICE_NAME"
          test -n "$PRODUCTION_BASE_URL"

      - name: Deploy verified source to CloudBase Run
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SERVICE_NAME: ${{ secrets.TCB_SERVICE_NAME }}
        run: |
          npm install --global @cloudbase/cli@latest
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
          tcb cloudrun deploy -e "$TCB_ENV_ID" -s "$TCB_SERVICE_NAME" --port 5001 --force

      - name: Verify production deployment
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
        run: python scripts/verify_deployment.py "$PRODUCTION_BASE_URL" --attempts 12 --interval 10
